<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container with rounded modern squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Production / Factory Line + Garment Geometric Wave & Growth Chart Bars -->
  <!-- Bar 1 (Left) -->
  <rect x="13" y="34" width="7" height="17" rx="3.5" fill="url(#primaryGrad)" fill-opacity="0.75" />
  
  <!-- Bar 2 (Middle) -->
  <rect x="23" y="24" width="7" height="27" rx="3.5" fill="url(#primaryGrad)" />
  
  <!-- Bar 3 (Right) -->
  <rect x="33" y="15" width="7" height="36" rx="3.5" fill="url(#primaryGrad)" />
  
  <!-- Modern Geometric Garment / Apparel Diamond Peak Symbol with Pulse -->
  <path d="M43 19L51 27L43 35L35 27Z" fill="url(#accentGrad)" filter="url(#glow)" />
  
  <!-- Trend Indicator Curve -->
  <path d="M14 31C20 28 25 21 34 16C38 13.5 44 14 49 18" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing Target Node -->
  <circle cx="49" cy="18" r="3" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="49" cy="18" r="1.5" fill="#0EA5E9" />
</svg>
